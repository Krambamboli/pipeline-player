profile_name: default
description: >
  Default Docling pipeline — fast & safe baseline.
  Uses RapidOCR (bundled, no extra install) + fast table mode.
  Enable enrichment features one-by-one as you install their dependencies.
pdf_options:
  # ── Core pipeline ───────────────────────────────────────────────────
  do_ocr: true
  do_table_structure: true
  # These require extra pip packages (easyocr / granite / chart-deps);
  # enable them after installing the relevant extras.
  do_chart_extraction: false
  do_code_enrichment: false
  do_formula_enrichment: false
  do_picture_classification: false
  do_picture_description: false
  force_backend_text: false
  enable_remote_services: false
  allow_external_plugins: false
  document_timeout: 120
  artifacts_path: null
  # ── Image generation ─────────────────────────────────────────────────
  generate_page_images: true
  generate_picture_images: true
  generate_table_images: false
  images_scale: 1.0
  generate_parsed_pages: false
  # ── Batch / performance ───────────────────────────────────────────────
  layout_batch_size: 4
  ocr_batch_size: 4
  table_batch_size: 4
  queue_max_size: 32
  batch_polling_interval_seconds: 0.5
  stage_shutdown_timeout_seconds: 5.0
  # ── OCR — rapidocr is bundled with docling, no extra install needed ──
  ocr_options:
    kind: rapidocr
    lang:
    - en
    force_full_page_ocr: false
    bitmap_area_threshold: 0.05
  # ── Tables ───────────────────────────────────────────────────────────
  table_structure_options:
    mode: fast          # use 'accurate' once you've verified models load
    do_cell_matching: true
  # ── Layout ───────────────────────────────────────────────────────────
  layout_options:
    keep_images: true
    use_legacy_layout: false
  heading_hierarchy_options:
    hierarchy_expansion_depth: 3
  # ── Accelerator — MPS for Apple Silicon ──────────────────────────────
  accelerator_options:
    device: auto
    num_threads: 4
  # ── Enrichment (all disabled until deps installed) ───────────────────
  picture_description_options:
    kind: disabled
    prompt: >-
      Describe this image in detail, including any text, charts, or diagrams.
  picture_classification_options:
    kind: disabled
  code_formula_options:
    kind: disabled
  chart_extraction_options:
    kind: disabled
output:
  formats:
  - html
  - markdown
  - json
